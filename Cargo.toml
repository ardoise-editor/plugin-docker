[package]
name = "ardoise-docker"
version = "1.0.1"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The Docker plugin of Ardoise"
license = "MIT"

[[bin]]
name = "docker-plugin"
path = "src/main.rs"

[dependencies]
ardoise-plugin = { git = "https://github.com/ardoise-editor/plugin-sdk", tag = "v0.16.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "3"
portable-pty = "0.9.0"
vt100 = "0.18.1"
ureq = { version = "3", features = ["platform-verifier"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
